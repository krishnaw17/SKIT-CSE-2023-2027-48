name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Generate Prisma Client
        run: pnpm --filter @glms/server run prisma:generate
        
      - name: Typecheck Server
        run: pnpm --filter @glms/server run typecheck
        
      - name: Typecheck Web
        run: pnpm --filter @glms/web run typecheck
        
      - name: Lint
        run: pnpm lint

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
          
      - name: Install dependencies
        run: pnpm install
        
      # Placeholder for tests once written
      - name: Run Web Tests
        run: pnpm --filter @glms/web test --passWithNoTests
